[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gasket-inspection"
version = "0.2.0"
description = "Multi-label ConvNeXt defect-score prototype for rubber-gasket inspection"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2,<3.0",
  "torchvision>=0.17,<1.0",
  "Pillow>=10.0",
  "PyYAML>=6.0",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
